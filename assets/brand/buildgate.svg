<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Buildgate mark: stacked bricks (the build) framing an archway (the
       gate), with the accepted check in the opening. Source of truth for
       every PNG under console/web/ and internal/notify/ -- regenerate them
       with scripts/render-icons.sh rather than editing a PNG by hand. -->
  <rect id="tile" width="512" height="512" rx="112" fill="#1c1917"/>
  <g id="mark">
    <g fill="#f97316">
      <rect x="88" y="96" width="160" height="64" rx="10"/>
      <rect x="264" y="96" width="160" height="64" rx="10"/>
      <rect x="88" y="176" width="96" height="64" rx="10"/>
      <rect x="328" y="176" width="96" height="64" rx="10"/>
      <rect x="88" y="256" width="96" height="64" rx="10"/>
      <rect x="328" y="256" width="96" height="64" rx="10"/>
      <rect x="88" y="336" width="96" height="80" rx="10"/>
      <rect x="328" y="336" width="96" height="80" rx="10"/>
    </g>
    <path d="M214 300 L246 332 L304 256" fill="none" stroke="#fafaf9" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
