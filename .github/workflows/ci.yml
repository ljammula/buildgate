name: CI

# pull_request deliberately not a trigger here: an iterative PR (several
# review-driven pushes to the same branch before merge, e.g. addressing
# review feedback in rounds) previously re-ran this full job -- Temporal
# dev server included -- on every single push, burning Actions minutes
# for runs whose result is superseded within minutes by the next push.
# main still verifies automatically post-merge as a safety net; run this
# manually against a PR branch (Actions tab -> CI -> Run workflow) when
# its result is actually needed before merging.
#
# Self-hosted runner: push/schedule triggers below are
# wired but stay no-ops on GitHub-hosted runners -- both jobs' own `if:`
# gates them on the `SELF_HOSTED_RUNNER` repository variable, which defaults
# unset (falsy), so today's effective behavior (manual-only, ubuntu-latest)
# is unchanged. See doc/self-hosted-runner.md for the one-time registration
# steps and exactly what flipping that variable turns on.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Nightly, well outside any normal working hours -- see
    # doc/self-hosted-runner.md. No-op (see the jobs' own `if:` gates) until
    # SELF_HOSTED_RUNNER=true.
    - cron: "17 9 * * *"

jobs:
  verify:
    # ubuntu-latest by default (today's behavior, unchanged); once the
    # operator sets the repository variable SELF_HOSTED_RUNNER=true (see
    # doc/self-hosted-runner.md), this retargets at the registered
    # self-hosted Mac Studio runner instead.
    runs-on: ${{ vars.SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted", "macOS"]') || 'ubuntu-latest' }}
    # A manual run (workflow_dispatch) always runs, on ubuntu-latest, exactly
    # as before this change. The push/schedule triggers added above are
    # otherwise no-ops (Actions minutes are the constraint on GitHub-hosted
    # runners -- see the historical comment this replaced) until the
    # operator opts in.
    if: github.event_name == 'workflow_dispatch' || vars.SELF_HOSTED_RUNNER == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # go.sum exists (Temporal landed as a real dependency) — the
          # prior "stdlib only, no go.sum" comment/cache:false pair here
          # was stale (see CLAIMS.md's Remaining gaps). Let setup-go cache
          # module downloads normally, keyed on go.sum.
          cache: true

      # `make verify` starts its own test Temporal dev server
      # (scripts/test-sharded.sh) from this CLI and runs every live Temporal
      # test against it; without the CLI those tests skip.
      - name: Install Temporal CLI
        # Downloads a specific, immutable GitHub release asset and
        # verifies its checksum before extracting anything -- no `curl |
        # sh`. Found via review (local `codex review`, round 2 on this
        # change): piping temporal.download/cli.sh to a shell still
        # executes a script fetched from a mutable URL on every run even
        # when a --version argument is passed to it, so a compromise of
        # that endpoint (or its delivery path) could run arbitrary
        # commands in a workflow triggered by any push or PR. GitHub
        # release assets for a tagged version don't change after
        # publication, and the checksum step below fails closed if this
        # asset ever did.
        run: |
          curl -sSfL -o /tmp/temporal_cli.tar.gz "https://github.com/temporalio/cli/releases/download/v1.8.2/temporal_cli_1.8.2_linux_amd64.tar.gz"
          echo "d8421bda989e6514b4bdb4d63a9012a8a05a806892e881a5aad8510496349a94  /tmp/temporal_cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.temporalio/bin"
          tar -xzf /tmp/temporal_cli.tar.gz -C "$HOME/.temporalio/bin" temporal
          chmod +x "$HOME/.temporalio/bin/temporal"
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: make verify
        run: |
          set -o pipefail
          make verify 2>&1 | tee /tmp/make-verify.log
          # A live Temporal test that skips (no test server reached it)
          # does not change make verify's exit code, so the skip message
          # is searched for and fails the job. The phrase is anchored: a
          # bare "is unreachable:" also appears in passing tests that
          # probe an unreachable address on purpose.
          if grep -qE "Temporal (Service|server) at \S+ is unreachable:" /tmp/make-verify.log; then
            echo "one or more live Temporal tests skipped (no test Temporal server reached them) -- failing explicitly, see the log above" >&2
            exit 1
          fi
        env:
          # -count=1: setup-go caches GOCACHE across runs, and go test's
          # result cache is not keyed on the server a test dials, so a
          # cached PASS or SKIP could be replayed. -v: without it go test
          # prints no skip reason for the guard above to find.
          GOFLAGS: -count=1 -v

      # Visibility only -- never fails the job (if: always(), and the run
      # itself has no failing exit path). Added 2026-09-16 alongside the
      # cold-build fix to cmd/factoryd's own TestMain (see that file's
      # runTests): the step above already runs with GOFLAGS=-v for the
      # false-green guard's own sake, so /tmp/make-verify.log already
      # carries a "--- PASS/FAIL: Test (Ns)" line for every top-level test
      # and subtest -- this just surfaces the slowest ones instead of
      # letting them sit unread past GitHub's own log rendering limits.
      # Before this, the ~300s cmd/factoryd spends actually running tests
      # (as opposed to the ~85s it used to spend rebuilding from a cold
      # cache every invocation, fixed separately) had no per-test
      # breakdown available at all from a CI run -- this is the cheapest
      # way to get one without re-running anything.
      - name: Slowest tests (visibility only)
        if: always()
        run: |
          if [ -f /tmp/make-verify.log ]; then
            grep -E '^(    )?--- (PASS|FAIL): ' /tmp/make-verify.log \
              | sed -E 's/^ *--- (PASS|FAIL): ([^ ]+) \(([0-9.]+)s\)/\3 \1 \2/' \
              | sort -rn \
              | head -25 \
              | awk '{printf "%8.2fs  %-4s  %s\n", $1, $2, $3}'
          fi

      # internal/sandbox/docker_test.go's TestRunLiveDocker gates itself on
      # DOCKER_SANDBOX_LIVE=1, so without the steps below CI would only
      # exercise that file's own hand-written fake `docker` shell script. A
      # locally built image normally has no RepoDigests at all (only a
      # registry push/pull populates that), and this runner's Docker does
      # not accept name@sha256:<local-image-id> as a runnable reference
      # either, so the images are pushed through a local registry to get a
      # real, engine-independent digest.
      - name: Local Docker registry for the live sandbox tests
        run: |
          docker run -d --restart=always -p 5000:5000 --name local-registry registry:2
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/v2/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "local Docker registry did not become healthy within 30s" >&2
          exit 1

      # The live sandbox test explicitly uses a worker image built from
      # this checkout; it is pushed through the local registry above to get a real,
      # engine-independent digest, and DOCKER_SANDBOX_IMAGE points the
      # live sandbox tests below at it instead of their own generic
      # python:3.13-slim-bookworm fallback -- so this job actually
      # exercises internal/sandbox/Dockerfile with a real Docker engine.
      - name: Build and push the sandbox worker image for the live sandbox tests
        run: |
          set -o pipefail
          docker build -f internal/sandbox/Dockerfile -t localhost:5000/buildgate-worker:live .
          push_output="$(docker push localhost:5000/buildgate-worker:live)"
          echo "$push_output"
          digest="$(printf '%s\n' "$push_output" | grep -oE 'sha256:[0-9a-f]+' | tail -1)"
          if [ -z "$digest" ]; then
            echo "could not read a digest from docker push output" >&2
            exit 1
          fi
          echo "DOCKER_SANDBOX_IMAGE=localhost:5000/buildgate-worker@$digest" >> "$GITHUB_ENV"

      - name: Live Docker sandbox tests
        run: |
          set -o pipefail
          DOCKER_SANDBOX_LIVE=1 go test -race -count=1 -v ./internal/sandbox/... -run TestRunLiveDocker 2>&1 | tee /tmp/live-sandbox.log
          # There is no built-in worker-image default to test resolving.
          # This proves the sandbox worker image builds cleanly from this
          # repo's own Dockerfile, and that a target project needing a
          # dependency the worker image doesn't already bake needs a
          # project-specific image (internal/sandbox/Dockerfile.project)
          # instead (found via a real GitHub Codex App review of PR #51).
          # Proves both directions against a real engine: a dependency
          # absent from this repo's own go.sum fails inside the plain base
          # image with no network, and succeeds once Dockerfile.project
          # bakes it in. Also runs the security regression test for a real
          # leak an earlier version of Dockerfile.project had (COPY .
          # against the target project's own root baked its whole tree --
          # .git, .env, any credential -- into an image layer): builds from
          # a fixture with a fake secret and confirms it never appears in
          # the saved image's own layer data.
          DOCKER_SANDBOX_LIVE=1 go test -race -count=1 -v ./internal/sandbox/... -run 'TestDockerfileProjectBakesMissingDependency|TestDockerfileProjectDoesNotLeakProjectSecrets' 2>&1 | tee /tmp/live-project-image.log
          # Same false-green risk as the make-verify step above: a silent
          # t.Skip (Docker unreachable, an image pull failing) must fail
          # this job explicitly rather than report a vacuous pass.
          if grep -qE "^--- SKIP" /tmp/live-sandbox.log /tmp/live-project-image.log; then
            echo "a live Docker test skipped instead of running -- failing explicitly, see the log above" >&2
            exit 1
          fi

  # Nightly live-Docker + Temporal-live backbone (`make verify-live`,
  # scripts/verify-live.sh) on the self-hosted runner only -- never
  # meaningful on GitHub-hosted ubuntu (no persistent Docker/Temporal state,
  # and no reason to pay Actions minutes for a live run there). Runs only
  # once the operator has set SELF_HOSTED_RUNNER=true (see
  # doc/self-hosted-runner.md), and only on the nightly schedule or a manual
  # dispatch -- never on every push, since a live run takes minutes rather
  # than the `verify` job's seconds. Deliberately calls the Makefile target
  # rather than duplicating the `verify` job's own per-test steps above: one
  # place defines what "live" coverage means, exercised identically here and
  # on a developer's own machine (`make verify-live`).
  verify-live:
    if: vars.SELF_HOSTED_RUNNER == 'true' && github.event_name != 'push'
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make verify-live
        run: make verify-live
