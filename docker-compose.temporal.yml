# Postgres-backed Temporal deployment for validating internal/workflow's
# Temporal-backed slice (RunWorkflow/RepositoryOwnerWorkflow/Activities)
# against a real server, and for durable, multi-instance use: this
# survives container recreation (named volume) and supports the
# concurrent-writer access multiple factoryd/worker instances need.
#
# Usage:
#   docker compose -f docker-compose.temporal.yml up -d
#   Web UI: http://localhost:8233
#   docker compose -f docker-compose.temporal.yml down        # stop, keep data
#   docker compose -f docker-compose.temporal.yml down -v     # stop, wipe data
#
# Override TEMPORAL_POSTGRES_PASSWORD in the environment (or a .env file)
# before first `up` in any shared/production environment — it defaults to
# "temporal" here for local convenience only.
#
# The project name is pinned so containers and volumes are buildgate-*
# regardless of the checkout directory's name.
name: buildgate
services:
  postgresql:
    image: postgres:15
    # Sized for one operator's worker, not Postgres's server defaults
    # (128MB shared buffers, 100 connections): with the pool limits on the
    # temporal service below, Postgres holds about 0.1 GiB instead of up to
    # 0.27 GiB and the whole stack about 0.4 GiB at most with two builds
    # running (measured 2026-10-04: 22 connections instead of 46).
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      - postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      - POSTGRES_SEEDS=postgresql
      # Per-service SQL pools (four services share this container; the image
      # defaults are 20 and 10). Their total stays under max_connections above.
      - SQL_MAX_CONNS=6
      - SQL_MAX_IDLE_CONNS=6
      - SQL_VIS_MAX_CONNS=2
      - SQL_VIS_MAX_IDLE_CONNS=2
    ports:
      - "7233:7233" # gRPC frontend (client.DefaultHostPort / TEMPORAL_ADDRESS)
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080" # Web UI
    restart: unless-stopped

  # One-shot: registers the three custom search attributes
  # internal/workflow.RunSearchAttributes sets on every RunWorkflow start
  # (FactoryTicket/FactoryProject/FactoryRunID, all Keyword) so the
  # Temporal Web UI's workflow list can be filtered by them (see
  # USAGE_REFERENCE.md, "Observe a run in Temporal"). `auto-setup`'s own env vars only add Temporal's
  # small built-in default set, not caller-named ones — these need the
  # `temporal operator search-attribute create` CLI, bundled in
  # `admin-tools`, run once against the now-registered default namespace.
  # `|| true` on each: idempotent across a restart of this service (the
  # server errors on an attribute that already exists; that's success,
  # not a failure to retry). A server started without this service (or a
  # pre-existing one from before this file added it) rejects a start
  # using these attributes — see workflow.IsInvalidSearchAttributeError's
  # own doc comment for the client-side fallback that tolerates that.
  temporal-search-attributes:
    image: temporalio/admin-tools:latest
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    entrypoint:
      - sh
      - -c
      - |
        until temporal operator cluster health --address temporal:7233; do sleep 1; done
        temporal operator search-attribute create --address temporal:7233 --name FactoryTicket --type Keyword || true
        temporal operator search-attribute create --address temporal:7233 --name FactoryProject --type Keyword || true
        temporal operator search-attribute create --address temporal:7233 --name FactoryRunID --type Keyword || true
    restart: "no"

volumes:
  temporal-postgres-data:
