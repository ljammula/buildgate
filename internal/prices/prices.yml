# USD per 1M tokens, from each provider's price page. Edit this file and
# rebuild (`make install`) when a provider changes its prices. Keyed by the
# provider's own model id (models.<m>.id in a session config), so every
# session config and every alias sharing that id shares one price. cached_input
# defaults to input and cache_write defaults to input when omitted (no cache
# discount/premium assumed).

gpt-5.6-sol:
  input: 4.00
  cached_input: 0.40
  output: 20.00
  source: https://developers.openai.com/api/docs/pricing
  as_of: 2026-09-28

gpt-5.6-terra:
  input: 2.00
  cached_input: 0.20
  output: 12.00
  source: https://developers.openai.com/api/docs/pricing
  as_of: 2026-09-28

gpt-5.6-luna:
  input: 0.20
  cached_input: 0.02
  output: 1.20
  source: https://developers.openai.com/api/docs/pricing
  as_of: 2026-09-28

# Anthropic cache_write is the 5-minute prompt-cache write price.
claude-fable-5-1:
  input: 10.00
  cache_write: 12.50
  cached_input: 0.25
  output: 50.00
  source: https://platform.claude.com/docs/en/about-claude/pricing
  as_of: 2026-09-28

claude-opus-5-5:
  input: 4.00
  cache_write: 5.00
  cached_input: 0.20
  output: 20.00
  source: https://platform.claude.com/docs/en/about-claude/pricing
  as_of: 2026-09-28

claude-sonnet-5:
  input: 2.00
  cache_write: 2.50
  cached_input: 0.20
  output: 10.00
  source: https://platform.claude.com/docs/en/about-claude/pricing
  as_of: 2026-09-28

claude-haiku-4-5-20251001:
  input: 1.00
  cache_write: 1.25
  cached_input: 0.10
  output: 5.00
  source: https://platform.claude.com/docs/en/about-claude/pricing
  as_of: 2026-09-28

# Local models served from the operator's own ai-stack host: no provider
# price, real cost $0. A zero price means the relay's dollar budget and
# ceiling never trip for the model; its token budget and ceiling bound it.
qwen38-mtplx-quality:
  input: 0
  output: 0
  source: local model (ai-stack host), no provider price
  as_of: 2026-09-28
