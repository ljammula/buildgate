# USD per 1M tokens, from each provider's price page. Edit this file and
# rebuild (`make install`) when a provider changes its prices. Keyed by the
# provider's own model id (models.<m>.id in a session config), so every
# session config and every alias sharing that id shares one price. cached_input
# defaults to input and cache_write defaults to input when omitted (no cache
# discount/premium assumed).

# OpenAI API model prices use the published standard, short-context rates.
# This table has one rate per model and token class; service-tier,
# long-context, modality-specific, per-minute, and per-call prices cannot
# be represented here.
gpt-6-astra:
  input: 10.00
  cached_input: 1.00
  cache_write: 12.50
  output: 50.00
  source: https://developers.openai.com/api/docs/pricing
  as_of: 2026-10-17

