version: v2
clean: false
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go]
    out: .
    opt:
      - paths=source_relative
      - Mextension.proto=buildgate/internal/meter/middlewarepb
      - Msupervisor_middleware.proto=buildgate/internal/meter/middlewarepb
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1]
    out: .
    opt:
      - paths=source_relative
      - Mextension.proto=buildgate/internal/meter/middlewarepb
      - Msupervisor_middleware.proto=buildgate/internal/meter/middlewarepb
inputs:
  - directory: proto
